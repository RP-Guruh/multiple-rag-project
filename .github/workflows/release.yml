name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux .deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Fat JAR
        run: ./mvnw clean package -DskipTests
        shell: bash

      - name: Inspect Built JAR
        run: ls -la target/
        shell: bash

      - name: Package .deb with jpackage
        run: |
          sudo apt-get update && sudo apt-get install -y fakeroot
          JAR_FILE=$(ls target/*.jar | grep -v 'original' | head -n 1)
          JAR_NAME=$(basename "$JAR_FILE")
          echo "Found JAR: $JAR_NAME"
          jpackage \
            --input target/ \
            --name devlablm \
            --main-jar "$JAR_NAME" \
            --main-class id.guruh.devlablm.DevlablmApplication \
            --type deb \
            --dest dist/ \
            --app-version 1.0.1 \
            --vendor "Guruh" \
            --description "DevLab LM Studio - Multi-Project RAG Platform" \
            --java-options "--sun-misc-unsafe-memory-access=allow"
          mv dist/*.deb dist/devlablm-linux-x86_64.deb

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devlablm-linux-deb
          path: dist/devlablm-linux-x86_64.deb

  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Fat JAR
        run: ./mvnw.cmd clean package -DskipTests
        shell: cmd

      - name: Package .exe with jpackage
        run: |
          $jar = Get-ChildItem target\*.jar | Where-Object { $_.Name -notlike "*original*" } | Select-Object -First 1
          Write-Host "Found JAR: $($jar.Name)"
          jpackage `
            --input target\ `
            --name devlablm `
            --main-jar $($jar.Name) `
            --main-class id.guruh.devlablm.DevlablmApplication `
            --type exe `
            --dest dist\ `
            --app-version 1.0.1 `
            --vendor "Guruh" `
            --description "DevLab LM Studio - Multi-Project RAG Platform" `
            --win-dir-chooser `
            --win-shortcut `
            --java-options "--sun-misc-unsafe-memory-access=allow"
          Move-Item -Path dist\*.exe -Destination dist\devlablm-windows-x64.exe
        shell: powershell

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devlablm-windows-exe
          path: dist/devlablm-windows-x64.exe

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: devlablm-linux-deb
          path: release-files/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: devlablm-windows-exe
          path: release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
